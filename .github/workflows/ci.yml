name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon test --target ${{ matrix.target }}
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon update
      - run: moon build --target js
      - run: moon info
      - run: git diff --exit-code pkg.generated.mbti
      - run: node scripts/check.mjs
      - run: python -B scripts/reference.py
      - run: python -B scripts/followup_reference.py
      - run: python -B scripts/critical_reference.py
      - run: python -B scripts/subgraph_reference.py
      - run: python -B scripts/degree_reference.py
      - run: python -B scripts/scale_reference.py
      - run: python -B scripts/pagerank_reference.py
      - run: python -B scripts/paths_reference.py
      - run: python -B scripts/diff_reference.py
